<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" width="480" height="290" role="img" aria-label="Technical Advisory — Hands-on guidance on architecture design and technology choices.">
  <title>Technical Advisory — Hands-on guidance on architecture design and technology choices.</title>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .16em; }
    .code { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0; }
    .tw { animation: tw 4.8s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="ca-bg" x1="0" y1="0" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141327"/><stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="ca-rim" x1="0" y1="0" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".05"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="ca-orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c72ed"/><stop offset="1" stop-color="#5548c8"/>
    </linearGradient>
    <radialGradient id="ca-glow">
      <stop offset="0" stop-color="#7c72ed" stop-opacity=".75"/>
      <stop offset=".35" stop-color="#7c72ed" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7c72ed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ca-neb-i">
      <stop offset="0" stop-color="#312e81" stop-opacity=".7"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ca-neb-p">
      <stop offset="0" stop-color="#581c87" stop-opacity=".55"/>
      <stop offset="1" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ca-clip"><rect width="480" height="290" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#ca-clip)">
    <rect width="480" height="290" fill="url(#ca-bg)"/>
    
    <circle class="tw" style="animation-delay:-3.0s" cx="11.9" cy="24.9" r="1.6" fill="#f5f0dd"/>
    <circle cx="98.7" cy="10.2" r="0.8" fill="#f5f0dd" opacity="0.64"/>
    <circle class="tw" style="animation-delay:-4.7s" cx="466.0" cy="105.2" r="0.8" fill="#f5f0dd"/>
    <circle class="tw" style="animation-delay:-3.9s" cx="215.7" cy="9.8" r="1.6" fill="#f5f0dd"/>
    <circle class="tw" style="animation-delay:-3.8s" cx="258.5" cy="286.6" r="1.6" fill="#f5f0dd"/>
    <circle class="tw" style="animation-delay:-4.5s" cx="235.5" cy="10.7" r="0.8" fill="#f5f0dd"/>
    
    <ellipse cx="470" cy="10" rx="300" ry="190" fill="url(#ca-neb-i)"/>
    <g transform="rotate(-18 418 58)">
      <ellipse cx="418" cy="58" rx="34" ry="13" fill="none" stroke="url(#ca-orbit)" stroke-width="1.4"/>
    </g>
    <circle cx="418" cy="58" r="14" fill="url(#ca-glow)"/>
    <circle cx="418" cy="58" r="3.5" fill="#f5f0dd"/>
    <text x="36" y="62" class="mono" font-size="14" fill="#8b85d9">03 · ADVISE</text>
    <text x="36" y="110" class="sans" font-size="31" font-weight="500" fill="#f4f4f5">Technical Advisory</text>
    <text x="36" y="150" class="sans" font-size="19" fill="#b0aabb">Hands-on guidance on</text>
    <text x="36" y="180" class="sans" font-size="19" fill="#b0aabb">architecture design and</text>
    <text x="36" y="210" class="sans" font-size="19" fill="#b0aabb">technology choices.</text>
    
  </g>
  <rect x=".75" y=".75" width="478.5" height="288.5" rx="18" fill="none" stroke="url(#ca-rim)" stroke-width="1.5"/>
</svg>
