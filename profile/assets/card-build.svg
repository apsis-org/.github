<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" width="480" height="290" role="img" aria-label="AI Implementation — Embedding AI into real business workflows and automating what slows teams down.">
  <title>AI Implementation — Embedding AI into real business workflows and automating what slows teams down.</title>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
