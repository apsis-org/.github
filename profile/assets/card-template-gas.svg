<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" width="480" height="290" role="img" aria-label="template-gas-monorepo — Many Google Apps Script projects in one TypeScript monorepo, bundled with esbuild.">
  <title>template-gas-monorepo — Many Google Apps Script projects in one TypeScript monorepo, bundled with esbuild.</title>
  <style>
