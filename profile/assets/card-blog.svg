<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" width="480" height="290" role="img" aria-label="Blog — Autonomous systems, algorithmic strategy, and enterprise architecture.">
  <title>Blog — Autonomous systems, algorithmic strategy, and enterprise architecture.</title>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .16em; }
    .code { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0; }
    .tw { animation: tw 4.8s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="mb-bg" x1="0" y1="0" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141327"/><stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="mb-rim" x1="0" y1="0" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".05"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="mb-orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c72ed"/><stop offset="1" stop-color="#5548c8"/>
    </linearGradient>
    <radialGradient id="mb-glow">
      <stop offset="0" stop-color="#7c72ed" stop-opacity=".75"/>
      <stop offset=".35" stop-color="#7c72ed" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7c72ed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mb-neb-i">
      <stop offset="0" stop-color="#312e81" stop-opacity=".7"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mb-neb-p">
      <stop offset="0" stop-color="#581c87" stop-opacity=".55"/>
      <stop offset="1" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mb-clip"><rect width="480" height="290" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#mb-clip)">
    <rect width="480" height="290" fill="url(#mb-bg)"/>
    
    <circle cx="15.8" cy="251.4" r="1.6" fill="#f5f0dd" opacity="0.38"/>
    <circle cx="321.6" cy="35.9" r="0.8" fill="#f5f0dd" opacity="0.66"/>
    <circle cx="10.4" cy="39.1" r="1.0" fill="#f5f0dd" opacity="0.82"/>
    <circle class="tw" style="animation-delay:-0.3s" cx="13.5" cy="4.1" r="1.0" fill="#f5f0dd"/>
    <circle cx="19.0" cy="250.1" r="0.6" fill="#f5f0dd" opacity="0.84"/>
    <circle cx="340.7" cy="24.7" r="1.2" fill="#f5f0dd" opacity="0.50"/>
    <circle cx="461.6" cy="70.1" r="1.0" fill="#f5f0dd" opacity="0.47"/>
    <circle cx="474.1" cy="158.8" r="1.2" fill="#f5f0dd" opacity="0.34"/>
    
    <ellipse cx="470" cy="10" rx="300" ry="190" fill="url(#mb-neb-i)"/>
    <g transform="rotate(-18 418 58)">
      <ellipse cx="418" cy="58" rx="34" ry="13" fill="none" stroke="url(#mb-orbit)" stroke-width="1.4"/>
    </g>
    <circle cx="418" cy="58" r="14" fill="url(#mb-glow)"/>
    <circle cx="418" cy="58" r="3.5" fill="#f5f0dd"/>
    <text x="36" y="62" class="mono" font-size="14" fill="#8b85d9">INSIGHTS</text>
    <text x="36" y="110" class="sans" font-size="31" font-weight="500" fill="#f4f4f5">Blog</text>
    <text x="36" y="150" class="sans" font-size="19" fill="#b0aabb">Autonomous systems, algorithmic</text>
    <text x="36" y="180" class="sans" font-size="19" fill="#b0aabb">strategy, and enterprise</text>
    <text x="36" y="210" class="sans" font-size="19" fill="#b0aabb">architecture.</text>
    <line x1="36" y1="238" x2="444" y2="238" stroke="#f4f4f5" stroke-opacity=".08"/><text x="36" y="266" class="mono" font-size="13" fill="#71717a">APSIS-DX.COM/BLOG →</text>
  </g>
  <rect x=".75" y=".75" width="478.5" height="288.5" rx="18" fill="none" stroke="url(#mb-rim)" stroke-width="1.5"/>
</svg>
