<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" width="480" height="290" role="img" aria-label="Signals — New models, features, and major announcements from leading AI companies — every day.">
  <title>Signals — New models, features, and major announcements from leading AI companies — every day.</title>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .16em; }
    .code { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0; }
    .tw { animation: tw 4.8s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="ms-bg" x1="0" y1="0" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141327"/><stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="ms-rim" x1="0" y1="0" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".05"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="ms-orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c72ed"/><stop offset="1" stop-color="#5548c8"/>
    </linearGradient>
    <radialGradient id="ms-glow">
      <stop offset="0" stop-color="#7c72ed" stop-opacity=".75"/>
      <stop offset=".35" stop-color="#7c72ed" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7c72ed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ms-neb-i">
      <stop offset="0" stop-color="#312e81" stop-opacity=".7"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ms-neb-p">
      <stop offset="0" stop-color="#581c87" stop-opacity=".55"/>
      <stop offset="1" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ms-clip"><rect width="480" height="290" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#ms-clip)">
    <rect width="480" height="290" fill="url(#ms-bg)"/>
    
    <circle class="tw" style="animation-delay:-0.5s" cx="306.9" cy="7.3" r="0.8" fill="#f5f0dd"/>
    <circle cx="283.4" cy="9.2" r="0.6" fill="#f5f0dd" opacity="0.38"/>
    <circle cx="12.7" cy="57.7" r="1.6" fill="#f5f0dd" opacity="0.67"/>
    <circle cx="366.5" cy="29.6" r="1.0" fill="#f5f0dd" opacity="0.31"/>
    <circle cx="467.1" cy="109.8" r="1.2" fill="#f5f0dd" opacity="0.43"/>
    <circle class="tw" style="animation-delay:-0.4s" cx="92.3" cy="20.2" r="1.6" fill="#f5f0dd"/>
    <circle cx="111.7" cy="29.3" r="0.8" fill="#f5f0dd" opacity="0.52"/>
    <circle cx="328.1" cy="20.7" r="1.6" fill="#f5f0dd" opacity="0.35"/>
    <circle cx="475.0" cy="185.6" r="1.2" fill="#f5f0dd" opacity="0.38"/>
    <circle cx="368.8" cy="16.2" r="0.6" fill="#f5f0dd" opacity="0.73"/>
    <circle class="tw" style="animation-delay:-0.5s" cx="478.7" cy="40.1" r="1.0" fill="#f5f0dd"/>
    <circle cx="202.6" cy="18.4" r="1.0" fill="#f5f0dd" opacity="0.61"/>
    <circle class="tw" style="animation-delay:-2.4s" cx="75.9" cy="0.9" r="1.6" fill="#f5f0dd"/>
    
    <ellipse cx="440" cy="300" rx="300" ry="190" fill="url(#ms-neb-p)"/>
    <g transform="rotate(-18 418 58)">
      <ellipse cx="418" cy="58" rx="34" ry="13" fill="none" stroke="url(#ms-orbit)" stroke-width="1.4"/>
    </g>
    <circle cx="418" cy="58" r="14" fill="url(#ms-glow)"/>
    <circle cx="418" cy="58" r="3.5" fill="#f5f0dd"/>
    <text x="36" y="62" class="mono" font-size="14" fill="#8b85d9">DAILY · AI NEWS</text>
    <text x="36" y="110" class="sans" font-size="31" font-weight="500" fill="#f4f4f5">Signals</text>
    <text x="36" y="150" class="sans" font-size="19" fill="#b0aabb">New models, features, and major</text>
    <text x="36" y="180" class="sans" font-size="19" fill="#b0aabb">announcements from leading AI</text>
    <text x="36" y="210" class="sans" font-size="19" fill="#b0aabb">companies — every day.</text>
    <line x1="36" y1="238" x2="444" y2="238" stroke="#f4f4f5" stroke-opacity=".08"/><text x="36" y="266" class="mono" font-size="13" fill="#71717a">APSIS-DX.COM/SIGNALS →</text>
  </g>
  <rect x=".75" y=".75" width="478.5" height="288.5" rx="18" fill="none" stroke="url(#ms-rim)" stroke-width="1.5"/>
</svg>
