<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" width="480" height="290" role="img" aria-label="template-slack-monorepo — Slack CLI apps on Slack&#x27;s managed infrastructure — no server of your own.">
  <title>template-slack-monorepo — Slack CLI apps on Slack's managed infrastructure — no server of your own.</title>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .16em; }
    .code { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0; }
    .tw { animation: tw 4.8s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="rs-bg" x1="0" y1="0" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141327"/><stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="rs-rim" x1="0" y1="0" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".05"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="rs-orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c72ed"/><stop offset="1" stop-color="#5548c8"/>
    </linearGradient>
    <radialGradient id="rs-glow">
      <stop offset="0" stop-color="#7c72ed" stop-opacity=".75"/>
      <stop offset=".35" stop-color="#7c72ed" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7c72ed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rs-neb-i">
      <stop offset="0" stop-color="#312e81" stop-opacity=".7"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rs-neb-p">
      <stop offset="0" stop-color="#581c87" stop-opacity=".55"/>
      <stop offset="1" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rs-clip"><rect width="480" height="290" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#rs-clip)">
    <rect width="480" height="290" fill="url(#rs-bg)"/>
    
    <circle cx="469.6" cy="15.8" r="1.6" fill="#f5f0dd" opacity="0.56"/>
    <circle cx="178.1" cy="9.9" r="0.8" fill="#f5f0dd" opacity="0.35"/>
    <circle class="tw" style="animation-delay:-2.3s" cx="16.4" cy="112.3" r="0.6" fill="#f5f0dd"/>
    <circle cx="239.6" cy="35.6" r="0.6" fill="#f5f0dd" opacity="0.79"/>
    <circle cx="86.2" cy="26.9" r="0.8" fill="#f5f0dd" opacity="0.72"/>
    <circle cx="273.5" cy="21.0" r="0.8" fill="#f5f0dd" opacity="0.70"/>
    <circle class="tw" style="animation-delay:-3.5s" cx="33.6" cy="12.6" r="1.2" fill="#f5f0dd"/>
    <circle class="tw" style="animation-delay:-0.7s" cx="2.5" cy="87.2" r="0.6" fill="#f5f0dd"/>
    
    <ellipse cx="440" cy="300" rx="300" ry="190" fill="url(#rs-neb-p)"/>
    <g transform="rotate(-18 418 58)">
      <ellipse cx="418" cy="58" rx="34" ry="13" fill="none" stroke="url(#rs-orbit)" stroke-width="1.4"/>
    </g>
    <circle cx="418" cy="58" r="14" fill="url(#rs-glow)"/>
    <circle cx="418" cy="58" r="3.5" fill="#f5f0dd"/>
    <text x="36" y="62" class="mono" font-size="14" fill="#8b85d9">TEMPLATE · SLACK</text>
    <text x="36" y="110" class="code" font-size="26" font-weight="500" fill="#f4f4f5">template-slack-monorepo</text>
    <text x="36" y="150" class="sans" font-size="19" fill="#b0aabb">Slack CLI apps on Slack's</text>
    <text x="36" y="180" class="sans" font-size="19" fill="#b0aabb">managed infrastructure —</text>
    <text x="36" y="210" class="sans" font-size="19" fill="#b0aabb">no server of your own.</text>
    <line x1="36" y1="238" x2="444" y2="238" stroke="#f4f4f5" stroke-opacity=".08"/><text x="36" y="266" class="mono" font-size="13" fill="#71717a">DENO · SLACK CLI</text>
  </g>
  <rect x=".75" y=".75" width="478.5" height="288.5" rx="18" fill="none" stroke="url(#rs-rim)" stroke-width="1.5"/>
