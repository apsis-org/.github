<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" width="480" height="290" role="img" aria-label="Works — Where business and technology, people and organizations meet.">
  <title>Works — Where business and technology, people and organizations meet.</title>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .16em; }
    .code { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0; }
    .tw { animation: tw 4.8s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="mw-bg" x1="0" y1="0" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141327"/><stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="mw-rim" x1="0" y1="0" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".05"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="mw-orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c72ed"/><stop offset="1" stop-color="#5548c8"/>
    </linearGradient>
    <radialGradient id="mw-glow">
      <stop offset="0" stop-color="#7c72ed" stop-opacity=".75"/>
      <stop offset=".35" stop-color="#7c72ed" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7c72ed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mw-neb-i">
      <stop offset="0" stop-color="#312e81" stop-opacity=".7"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mw-neb-p">
      <stop offset="0" stop-color="#581c87" stop-opacity=".55"/>
      <stop offset="1" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mw-clip"><rect width="480" height="290" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#mw-clip)">
    <rect width="480" height="290" fill="url(#mw-bg)"/>
    
    <circle cx="18.5" cy="201.9" r="0.8" fill="#f5f0dd" opacity="0.83"/>
    <circle class="tw" style="animation-delay:-2.1s" cx="335.3" cy="27.9" r="1.2" fill="#f5f0dd"/>
    <circle class="tw" style="animation-delay:-1.9s" cx="180.4" cy="27.8" r="1.2" fill="#f5f0dd"/>
    <circle class="tw" style="animation-delay:-0.3s" cx="469.5" cy="78.9" r="0.8" fill="#f5f0dd"/>
    <circle cx="250.7" cy="29.9" r="1.2" fill="#f5f0dd" opacity="0.64"/>
    <circle cx="60.6" cy="23.2" r="0.8" fill="#f5f0dd" opacity="0.28"/>
    <circle cx="264.9" cy="32.9" r="1.0" fill="#f5f0dd" opacity="0.79"/>
    <circle class="tw" style="animation-delay:-3.7s" cx="70.4" cy="30.7" r="0.6" fill="#f5f0dd"/>
    <circle cx="16.0" cy="208.1" r="1.6" fill="#f5f0dd" opacity="0.49"/>
    <circle class="tw" style="animation-delay:-1.0s" cx="463.2" cy="194.2" r="0.8" fill="#f5f0dd"/>
    <circle cx="184.2" cy="287.0" r="0.8" fill="#f5f0dd" opacity="0.29"/>
    
    <ellipse cx="470" cy="10" rx="300" ry="190" fill="url(#mw-neb-i)"/>
    <g transform="rotate(-18 418 58)">
      <ellipse cx="418" cy="58" rx="34" ry="13" fill="none" stroke="url(#mw-orbit)" stroke-width="1.4"/>
    </g>
    <circle cx="418" cy="58" r="14" fill="url(#mw-glow)"/>
    <circle cx="418" cy="58" r="3.5" fill="#f5f0dd"/>
    <text x="36" y="62" class="mono" font-size="14" fill="#8b85d9">CASE STUDIES</text>
    <text x="36" y="110" class="sans" font-size="31" font-weight="500" fill="#f4f4f5">Works</text>
    <text x="36" y="150" class="sans" font-size="19" fill="#b0aabb">Where business and technology,</text>
    <text x="36" y="180" class="sans" font-size="19" fill="#b0aabb">people and organizations</text>
    <text x="36" y="210" class="sans" font-size="19" fill="#b0aabb">meet.</text>
    <line x1="36" y1="238" x2="444" y2="238" stroke="#f4f4f5" stroke-opacity=".08"/><text x="36" y="266" class="mono" font-size="13" fill="#71717a">APSIS-DX.COM/WORKS →</text>
  </g>
  <rect x=".75" y=".75" width="478.5" height="288.5" rx="18" fill="none" stroke="url(#mw-rim)" stroke-width="1.5"/>
</svg>
