<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Loki — Co-Founder / DX Engineer">
  <title>Loki — Co-Founder / DX Engineer</title>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .16em; }
    .code { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0; }
    .tw { animation: tw 4.8s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="ol-bg" x1="0" y1="0" x2="640" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141327"/><stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="ol-rim" x1="0" y1="0" x2="640" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".05"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="ol-orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c72ed"/><stop offset="1" stop-color="#5548c8"/>
    </linearGradient>
    <radialGradient id="ol-glow">
      <stop offset="0" stop-color="#7c72ed" stop-opacity=".75"/>
      <stop offset=".35" stop-color="#7c72ed" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7c72ed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ol-neb-i">
      <stop offset="0" stop-color="#312e81" stop-opacity=".7"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ol-neb-p">
      <stop offset="0" stop-color="#581c87" stop-opacity=".55"/>
      <stop offset="1" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ol-clip"><rect width="640" height="200" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#ol-clip)">
    <rect width="640" height="200" fill="url(#ol-bg)"/>
    
    <circle cx="277.5" cy="28.8" r="1.6" fill="#f5f0dd" opacity="0.49"/>
    <circle class="tw" style="animation-delay:-1.8s" cx="149.7" cy="36.1" r="1.2" fill="#f5f0dd"/>
    <circle cx="544.1" cy="199.7" r="1.0" fill="#f5f0dd" opacity="0.36"/>
    <circle cx="124.8" cy="14.3" r="1.0" fill="#f5f0dd" opacity="0.31"/>
    <circle cx="260.8" cy="191.4" r="0.8" fill="#f5f0dd" opacity="0.69"/>
    <circle cx="534.8" cy="192.4" r="1.2" fill="#f5f0dd" opacity="0.53"/>
    <circle cx="516.4" cy="35.7" r="1.2" fill="#f5f0dd" opacity="0.26"/>
    <circle class="tw" style="animation-delay:-2.2s" cx="204.6" cy="15.6" r="0.8" fill="#f5f0dd"/>
    <circle class="tw" style="animation-delay:-1.3s" cx="90.8" cy="21.5" r="0.8" fill="#f5f0dd"/>
    
    <ellipse cx="120" cy="100" rx="260" ry="170" fill="url(#ol-neb-i)"/>
    <g transform="rotate(-18 112 100)">
      <ellipse cx="112" cy="100" rx="72" ry="26" fill="none" stroke="url(#ol-orbit)" stroke-width="1.4"/>
      <circle r="3" fill="#f5f0dd">
        <animateMotion dur="14s" repeatCount="indefinite" path="M40,100 a72,26 0 1,0 144,0 a72,26 0 1,0 -144,0"/>
      </circle>
    </g>
    <circle cx="112" cy="100" r="40" fill="#141327" stroke="#f4f4f5" stroke-opacity=".18"/>
    <text x="112" y="114" text-anchor="middle" class="sans" font-size="38" font-weight="500" fill="#f4f4f5">L</text>
    <text x="222" y="70" class="mono" font-size="14" fill="#8b85d9">CO-FOUNDER</text>
    <text x="222" y="114" class="sans" font-size="38" font-weight="500" fill="#f4f4f5">Loki</text>
    <text x="222" y="146" class="sans" font-size="19" fill="#b0aabb">DX Engineer</text>
    <text x="604" y="176" text-anchor="end" class="code" font-size="13" fill="#71717a">@Cloud-Xero →</text>
  </g>
  <rect x=".75" y=".75" width="638.5" height="198.5" rx="18" fill="none" stroke="url(#ol-rim)" stroke-width="1.5"/>
</svg>
