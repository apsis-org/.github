<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" width="480" height="290" role="img" aria-label="template-teams-bot — A Microsoft Teams Bot on Azure Functions, provisioned with Terraform.">
  <title>template-teams-bot — A Microsoft Teams Bot on Azure Functions, provisioned with Terraform.</title>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .16em; }
    .code { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0; }
    .tw { animation: tw 4.8s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="rt-bg" x1="0" y1="0" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141327"/><stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="rt-rim" x1="0" y1="0" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".05"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="rt-orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c72ed"/><stop offset="1" stop-color="#5548c8"/>
    </linearGradient>
    <radialGradient id="rt-glow">
      <stop offset="0" stop-color="#7c72ed" stop-opacity=".75"/>
      <stop offset=".35" stop-color="#7c72ed" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7c72ed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rt-neb-i">
      <stop offset="0" stop-color="#312e81" stop-opacity=".7"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rt-neb-p">
      <stop offset="0" stop-color="#581c87" stop-opacity=".55"/>
      <stop offset="1" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rt-clip"><rect width="480" height="290" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#rt-clip)">
    <rect width="480" height="290" fill="url(#rt-bg)"/>
    
    <circle cx="81.3" cy="289.1" r="1.6" fill="#f5f0dd" opacity="0.33"/>
    <circle class="tw" style="animation-delay:-0.7s" cx="26.9" cy="13.6" r="0.8" fill="#f5f0dd"/>
    <circle cx="471.3" cy="16.0" r="0.8" fill="#f5f0dd" opacity="0.34"/>
    <circle cx="474.9" cy="190.5" r="0.8" fill="#f5f0dd" opacity="0.71"/>
    <circle cx="15.4" cy="195.0" r="0.6" fill="#f5f0dd" opacity="0.71"/>
    <circle cx="470.9" cy="95.5" r="0.8" fill="#f5f0dd" opacity="0.64"/>
    <circle cx="197.2" cy="27.9" r="0.6" fill="#f5f0dd" opacity="0.40"/>
    
    <ellipse cx="470" cy="10" rx="300" ry="190" fill="url(#rt-neb-i)"/>
    <g transform="rotate(-18 418 58)">
      <ellipse cx="418" cy="58" rx="34" ry="13" fill="none" stroke="url(#rt-orbit)" stroke-width="1.4"/>
