    <text x="36" y="62" class="mono" font-size="14" fill="#8b85d9">TEMPLATE · TEAMS</text>
    <text x="36" y="110" class="code" font-size="26" font-weight="500" fill="#f4f4f5">template-teams-bot</text>
    <text x="36" y="150" class="sans" font-size="19" fill="#b0aabb">A Microsoft Teams Bot on Azure</text>
    <text x="36" y="180" class="sans" font-size="19" fill="#b0aabb">Functions, provisioned with</text>
    <text x="36" y="210" class="sans" font-size="19" fill="#b0aabb">Terraform.</text>
    <line x1="36" y1="238" x2="444" y2="238" stroke="#f4f4f5" stroke-opacity=".08"/><text x="36" y="266" class="mono" font-size="13" fill="#71717a">TYPESCRIPT · AZURE · TERRAFORM</text>
  </g>
  <rect x=".75" y=".75" width="478.5" height="288.5" rx="18" fill="none" stroke="url(#rt-rim)" stroke-width="1.5"/>
