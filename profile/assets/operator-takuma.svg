<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Takuma — Co-Founder / DX Engineer">
  <title>Takuma — Co-Founder / DX Engineer</title>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .16em; }
    .code { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0; }
    .tw { animation: tw 4.8s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="ot-bg" x1="0" y1="0" x2="640" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141327"/><stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="ot-rim" x1="0" y1="0" x2="640" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".05"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="ot-orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c72ed"/><stop offset="1" stop-color="#5548c8"/>
    </linearGradient>
    <radialGradient id="ot-glow">
      <stop offset="0" stop-color="#7c72ed" stop-opacity=".75"/>
      <stop offset=".35" stop-color="#7c72ed" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7c72ed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ot-neb-i">
      <stop offset="0" stop-color="#312e81" stop-opacity=".7"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ot-neb-p">
      <stop offset="0" stop-color="#581c87" stop-opacity=".55"/>
      <stop offset="1" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ot-clip"><rect width="640" height="200" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#ot-clip)">
    <rect width="640" height="200" fill="url(#ot-bg)"/>
    
    <circle cx="593.9" cy="34.6" r="0.8" fill="#f5f0dd" opacity="0.79"/>
    <circle cx="429.3" cy="34.2" r="0.8" fill="#f5f0dd" opacity="0.35"/>
    <circle cx="630.6" cy="34.3" r="0.6" fill="#f5f0dd" opacity="0.27"/>
    <circle cx="12.1" cy="173.7" r="1.2" fill="#f5f0dd" opacity="0.64"/>
    <circle cx="286.6" cy="3.9" r="1.0" fill="#f5f0dd" opacity="0.81"/>
    <circle cx="8.8" cy="49.8" r="0.6" fill="#f5f0dd" opacity="0.64"/>
    <circle cx="129.4" cy="190.4" r="0.8" fill="#f5f0dd" opacity="0.46"/>
    <circle cx="62.6" cy="3.2" r="1.6" fill="#f5f0dd" opacity="0.52"/>
    <circle class="tw" style="animation-delay:-4.8s" cx="582.9" cy="191.0" r="0.6" fill="#f5f0dd"/>
    <circle cx="634.5" cy="193.6" r="1.0" fill="#f5f0dd" opacity="0.81"/>
    <circle cx="456.4" cy="33.8" r="1.6" fill="#f5f0dd" opacity="0.27"/>
    <circle cx="88.1" cy="6.0" r="1.6" fill="#f5f0dd" opacity="0.43"/>
    <circle cx="485.0" cy="34.4" r="1.6" fill="#f5f0dd" opacity="0.65"/>
    
    <defs><clipPath id="ot-avatar"><circle cx="112" cy="100" r="46"/></clipPath></defs>
    <ellipse cx="120" cy="100" rx="260" ry="170" fill="url(#ot-neb-i)"/>
    <circle cx="112" cy="100" r="72" fill="url(#ot-glow)" opacity=".7"/>
    <path d="M26,100 a86,30 0 0,1 172,0" transform="rotate(-18 112 100)" fill="none" stroke="url(#ot-orbit)" stroke-width="1.4" stroke-opacity=".7"/>
    <image href="data:image/jpeg;base64," x="66" y="54" width="92" height="92"
           clip-path="url(#ot-avatar)" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="112" cy="100" r="46" fill="none" stroke="#f4f4f5" stroke-opacity=".22" stroke-width="1.2"/>
    <g transform="rotate(-18 112 100)">
      <path d="M26,100 a86,30 0 0,0 172,0" fill="none" stroke="url(#ot-orbit)" stroke-width="1.6"/>
      <circle r="3" fill="#f5f0dd">
        <animateMotion dur="14s" repeatCount="indefinite" path="M26,100 a86,30 0 0,1 172,0 a86,30 0 0,1 -172,0"/>
      </circle>
    </g>
    <text x="232" y="70" class="mono" font-size="14" fill="#8b85d9">CO-FOUNDER</text>
    <text x="232" y="114" class="sans" font-size="38" font-weight="500" fill="#f4f4f5">Takuma</text>
    <text x="232" y="146" class="sans" font-size="19" fill="#b0aabb">DX Engineer</text>
    <text x="604" y="176" text-anchor="end" class="code" font-size="13" fill="#71717a">@takuma531zov →</text>
  </g>
  <rect x=".75" y=".75" width="638.5" height="198.5" rx="18" fill="none" stroke="url(#ot-rim)" stroke-width="1.5"/>
</svg>
