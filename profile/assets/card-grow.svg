<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" width="480" height="290" role="img" aria-label="DX Talent Development — Helping your people master AI so they can drive DX on their own.">
  <title>DX Talent Development — Helping your people master AI so they can drive DX on their own.</title>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .16em; }
    .code { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0; }
    .tw { animation: tw 4.8s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="cg-bg" x1="0" y1="0" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141327"/><stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cg-rim" x1="0" y1="0" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".05"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="cg-orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c72ed"/><stop offset="1" stop-color="#5548c8"/>
    </linearGradient>
    <radialGradient id="cg-glow">
      <stop offset="0" stop-color="#7c72ed" stop-opacity=".75"/>
      <stop offset=".35" stop-color="#7c72ed" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7c72ed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cg-neb-i">
      <stop offset="0" stop-color="#312e81" stop-opacity=".7"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cg-neb-p">
      <stop offset="0" stop-color="#581c87" stop-opacity=".55"/>
      <stop offset="1" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cg-clip"><rect width="480" height="290" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cg-clip)">
    <rect width="480" height="290" fill="url(#cg-bg)"/>
    
    <circle cx="11.3" cy="289.6" r="0.8" fill="#f5f0dd" opacity="0.67"/>
    <circle cx="10.2" cy="76.6" r="1.0" fill="#f5f0dd" opacity="0.36"/>
    <circle cx="88.8" cy="14.2" r="1.2" fill="#f5f0dd" opacity="0.79"/>
    <circle cx="12.1" cy="166.9" r="1.2" fill="#f5f0dd" opacity="0.58"/>
    <circle cx="42.3" cy="289.0" r="0.8" fill="#f5f0dd" opacity="0.31"/>
    <circle cx="3.2" cy="133.1" r="0.8" fill="#f5f0dd" opacity="0.35"/>
    <circle cx="17.7" cy="155.3" r="1.6" fill="#f5f0dd" opacity="0.69"/>
    <circle cx="281.8" cy="12.5" r="0.6" fill="#f5f0dd" opacity="0.55"/>
    <circle cx="280.6" cy="287.5" r="1.6" fill="#f5f0dd" opacity="0.77"/>
    <circle cx="168.1" cy="18.6" r="0.6" fill="#f5f0dd" opacity="0.35"/>
    
    <ellipse cx="440" cy="300" rx="300" ry="190" fill="url(#cg-neb-p)"/>
    <g transform="rotate(-18 418 58)">
      <ellipse cx="418" cy="58" rx="34" ry="13" fill="none" stroke="url(#cg-orbit)" stroke-width="1.4"/>
