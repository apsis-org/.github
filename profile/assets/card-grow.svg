    <text x="36" y="62" class="mono" font-size="14" fill="#8b85d9">02 · GROW</text>
    <text x="36" y="110" class="sans" font-size="31" font-weight="500" fill="#f4f4f5">DX Talent Development</text>
    <text x="36" y="150" class="sans" font-size="19" fill="#b0aabb">Helping your people master AI</text>
    <text x="36" y="180" class="sans" font-size="19" fill="#b0aabb">so they can drive DX on their</text>
    <text x="36" y="210" class="sans" font-size="19" fill="#b0aabb">own.</text>
    
  </g>
  <rect x=".75" y=".75" width="478.5" height="288.5" rx="18" fill="none" stroke="url(#cg-rim)" stroke-width="1.5"/>
